spring:
  application:
    name: weather-api
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

weather:
  api:
    key: ${WEATHER_API_KEY:your_api_key_here}
    base-url: https://api.weatherapi.com/v1
    timeout: 10000

logging:
  level:
    root: INFO
    com.weather: DEBUG
